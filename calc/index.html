<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="../portfolio/calc-logo.svg" type="image/svg+xml">
    <meta name="theme-color" content="#1f2937">
</head>
<body>
    <div class="calculator">
        <div class="topbar">
            <div class="brand">
                <span class="logo-dot"></span>
                <span class="brand-text">Calc</span>
            </div>
            <a class="topbar-link" href="../portfolio/index.html" aria-label="Back to Portfolio">Back to Portfolio</a>
        </div>
        <div class="calc-header">
            <div class="title">Calculator</div>
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
        </div>
        <input type="text" id="display" class="display" readonly>
        <div class="keys">
            <button data-key="7">7</button>
            <button data-key="8">8</button>
            <button data-key="9">9</button>
            <button data-op="/">÷</button>
            <button data-key="4">4</button>
            <button data-key="5">5</button>
            <button data-key="6">6</button>
            <button data-op="*">×</button>
            <button data-key="1">1</button>
            <button data-key="2">2</button>
            <button data-key="3">3</button>
            <button data-op="-">−</button>
            <button data-key="0">0</button>
            <button data-key=".">.</button>
            <button id="clear">C</button>
            <button data-op="+">+</button>
            <button id="equals" class="equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
