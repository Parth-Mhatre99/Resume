<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sahyadri Mountain Logo">
  <defs>
    <linearGradient id="mountainLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="mountainDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0b1220"/>
  <g transform="translate(160,60)" filter="url(#shadow)">
    <rect rx="24" width="480" height="280" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <!-- Sun -->
    <circle cx="390" cy="90" r="28" fill="url(#sunGrad)" opacity="0.9"/>
    <!-- Back mountain range -->
    <polygon points="90,220 210,110 270,170 330,130 400,180 470,120 560,200 570,220 90,220"
             fill="url(#mountainDark)" opacity="0.8"/>
    <!-- Front mountain range with snow caps -->
    <polygon points="60,220 180,140 230,175 290,135 360,200 420,160 520,220 60,220"
             fill="url(#mountainLight)"/>
    <!-- Snow caps -->
    <polygon points="178,140 165,155 195,155" fill="#e5e7eb" opacity="0.9"/>
    <polygon points="288,135 275,150 305,150" fill="#e5e7eb" opacity="0.9"/>
    <polygon points="418,160 405,175 435,175" fill="#e5e7eb" opacity="0.9"/>
    <!-- Label -->
    <text x="240" y="255" text-anchor="middle" font-family="Inter, Arial" font-weight="700" font-size="24" fill="#e5e7eb">Sahyadri</text>
  </g>
</svg>


