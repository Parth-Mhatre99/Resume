<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Number Guessing Project Logo">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0b1220"/>
  <g transform="translate(200,60)" filter="url(#s)">
    <rect rx="24" width="400" height="280" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <rect x="24" y="210" rx="10" width="352" height="16" fill="#1f2937"/>
    <rect x="24" y="210" rx="10" width="120" height="16" fill="url(#gg)"/>
    <text x="224" y="96" text-anchor="middle" font-family="Inter, Arial" font-weight="700" font-size="56" fill="#e5e7eb">?</text>
    <text x="224" y="150" text-anchor="middle" font-family="Inter, Arial" font-size="16" fill="#cbd5e1">Guess a number 1–100</text>
  </g>
</svg>


